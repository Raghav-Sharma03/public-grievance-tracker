<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: #1a73e8 !important; }
        .stat-card {
            border: none;
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .card-total    { background: #1a73e8; }
        .card-pending  { background: #f9a825; }
        .card-progress { background: #0288d1; }
        .card-resolved { background: #2e7d32; }
        .stat-number { font-size: 36px; font-weight: 700; }
        .stat-label  { font-size: 14px; opacity: 0.9; }
        .complaint-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            transition: transform 0.2s;
        }
        .complaint-card:hover { transform: translateY(-2px); }
        .badge-pending    { background: #f9a825; color: white; }
        .badge-progress   { background: #0288d1; color: white; }
        .badge-resolved   { background: #2e7d32; color: white; }
        .badge-rejected   { background: #c62828; color: white; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold">Grievance Tracker</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white"
                  th:text="'Welcome, ' + ${citizen.name}">Welcome</span>
            <a href="/citizen/submit-complaint"
               class="btn btn-light btn-sm">+ New Complaint</a>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Success message -->
    <div th:if="${param.success}"
         class="alert alert-success alert-dismissible">
        Complaint submitted successfully!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card card-total">
                <div class="stat-number" th:text="${total}">0</div>
                <div class="stat-label">Total Complaints</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-pending">
                <div class="stat-number" th:text="${pending}">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-progress">
                <div class="stat-number" th:text="${inProgress}">0</div>
                <div class="stat-label">In Progress</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-resolved">
                <div class="stat-number" th:text="${resolved}">0</div>
                <div class="stat-label">Resolved</div>
            </div>
        </div>
    </div>

    <!-- Complaints List -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3">
            <h5 class="mb-0">My Complaints</h5>
        </div>
        <div class="card-body">

            <!-- No complaints message -->
            <div th:if="${#lists.isEmpty(complaints)}"
                 class="text-center py-5 text-muted">
                <p class="mb-2">You haven't submitted any complaints yet.</p>
                <a href="/citizen/submit-complaint"
                   class="btn btn-primary">Submit Your First Complaint</a>
            </div>

            <!-- Complaints list -->
            <div th:each="complaint : ${complaints}">
                <div class="complaint-card card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1" th:text="${complaint.title}">Title</h6>
                                <small class="text-muted"
                                       th:text="${complaint.category}">Category</small>
                                <br>
                                <small class="text-muted"
                                       th:text="${complaint.location}">Location</small>
                            </div>
                            <div class="text-end">
                                <span class="badge rounded-pill px-3 py-2"
                                      th:classappend="${complaint.status.name() == 'PENDING'} ? 'badge-pending' :
                                                      (${complaint.status.name() == 'IN_PROGRESS'} ? 'badge-progress' :
                                                      (${complaint.status.name() == 'RESOLVED'} ? 'badge-resolved' : 'badge-rejected'))"
                                      th:text="${complaint.status}">Status</span>
                                <br>
                                <small class="text-muted mt-1 d-block"
                                       th:text="${#temporals.format(complaint.createdAt, 'dd MMM yyyy')}">
                                    Date
                                </small>
                                <a th:href="@{/citizen/complaint/{id}(id=${complaint.id})}"
                                   class="btn btn-outline-primary btn-sm mt-1">View</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Submit Complaint - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: #1a73e8 !important; }
        .form-card {
            max-width: 650px;
            margin: 40px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">Grievance Tracker</span>
        <a href="/citizen/dashboard" class="btn btn-outline-light btn-sm">
            Back to Dashboard
        </a>
    </div>
</nav>

<div class="container">
    <div class="card form-card">
        <div class="card-header bg-white border-0 pt-4 px-4">
            <h4 class="mb-0">Submit a New Complaint</h4>
            <small class="text-muted">Fill in all details clearly</small>
        </div>
        <div class="card-body px-4 pb-4">

<div id="errorMsg" class="alert alert-danger"
     th:classappend="${errorMessage} ? '' : ' d-none'"
     th:text="${errorMessage} ?: ''"></div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Complaint Title</label>
                <input type="text" id="title" class="form-control"
                       placeholder="Brief title of your complaint">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Category</label>
                <select id="category" class="form-select">
                    <option value="">Select a category</option>
                    <option value="Road">Road / Infrastructure</option>
                    <option value="Water">Water Supply</option>
                    <option value="Electricity">Electricity</option>
                    <option value="Sanitation">Sanitation / Garbage</option>
                    <option value="Noise">Noise Pollution</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Location</label>
                <input type="text" id="location" class="form-control"
                       placeholder="Area, street or landmark">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea id="description" class="form-control" rows="4"
                          placeholder="Describe the issue in detail"></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Attach Image (optional)
                </label>
                <input type="file" id="imageFile" class="form-control"
                       accept="image/*">
                <div id="imagePreviewContainer" class="d-none mt-3">
                    <img id="imagePreview" class="img-fluid rounded"
                         style="max-width: 300px;" alt="Selected complaint image preview">
                    <div id="imageInfo" class="small text-muted mt-2"></div>
                </div>
            </div>

            <button type="button" id="submitComplaintButton" class="btn btn-primary w-100 py-2"
                    onclick="submitComplaint()">
                Submit Complaint
            </button>
        </div>
    </div>
</div>

<script>
const imageFileInput = document.getElementById('imageFile');
const imagePreviewContainer = document.getElementById('imagePreviewContainer');
const imagePreview = document.getElementById('imagePreview');
const imageInfo = document.getElementById('imageInfo');

imageFileInput.addEventListener('change', function() {
    const file = imageFileInput.files[0];
    if (!file) {
        imagePreviewContainer.classList.add('d-none');
        imagePreview.removeAttribute('src');
        imageInfo.textContent = '';
        return;
    }

    const reader = new FileReader();
    reader.onload = function(event) {
        imagePreview.onload = function() {
            const sizeInKb = (file.size / 1024).toFixed(1);
            imageInfo.textContent = imagePreview.naturalWidth + ' × '
                    + imagePreview.naturalHeight + ' px · ' + sizeInKb + ' KB';
            imagePreviewContainer.classList.remove('d-none');
        };
        imagePreview.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

function submitComplaint() {
    const submitButton = document.getElementById('submitComplaintButton');
    submitButton.disabled = true;
    submitButton.textContent = 'Please wait...';

    const title = document.getElementById('title').value.trim();
    const category = document.getElementById('category').value;
    const location = document.getElementById('location').value.trim();
    const description = document.getElementById('description').value.trim();
    const imageFile = document.getElementById('imageFile').files[0];

    if (!title || !category || !location || !description) {
        showError('Please fill all required fields.');
        resetSubmitButton();
        return;
    }

    const formData = new FormData();
    formData.append('title', title);
    formData.append('category', category);
    formData.append('location', location);
    formData.append('description', description);
    if (imageFile) {
        formData.append('imageFile', imageFile);
    }

    fetch('/citizen/submit-complaint', {
        method: 'POST',
        headers: {
            [document.querySelector('meta[name="_csrf_header"]').content]:
                document.querySelector('meta[name="_csrf"]').content
        },
        body: formData
    }).then(response => {
        if (response.redirected) {
            window.location.href = response.url;
        } else if (response.ok) {
            window.location.href = '/citizen/dashboard?success=true';
        } else {
            showError('Something went wrong. Please try again.');
            resetSubmitButton();
        }
    }).catch(() => {
        showError('Network error. Please try again.');
        resetSubmitButton();
    });
}

function resetSubmitButton() {
    const submitButton = document.getElementById('submitComplaintButton');
    submitButton.disabled = false;
    submitButton.textContent = 'Submit Complaint';
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.style.display = 'block';
    el.textContent = msg;
}
</script>
</body>
</html>

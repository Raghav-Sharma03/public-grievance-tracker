<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Admin Dashboard - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: #1a73e8 !important; }
        .stat-card {
            border: none;
            border-radius: 12px;
            padding: 20px;
            color: white;
            text-align: center;
        }
        .card-total    { background: #1a73e8; }
        .card-pending  { background: #f9a825; }
        .card-progress { background: #0288d1; }
        .card-resolved { background: #2e7d32; }
        .stat-number { font-size: 36px; font-weight: 700; }
        .stat-label  { font-size: 14px; opacity: 0.9; }
        .complaint-row { cursor: pointer; }
        .complaint-row:hover { background: #f8f9fa; }
        .badge-PENDING    { background: #f9a825; color: white; }
        .badge-IN_PROGRESS { background: #0288d1; color: white; }
        .badge-RESOLVED   { background: #2e7d32; color: white; }
        .badge-REJECTED   { background: #c62828; color: white; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold">Grievance Tracker — Admin</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white"
                  th:text="'Welcome, ' + ${admin.name}">Welcome</span>
            <a href="/admin/users"
               class="btn btn-outline-light btn-sm">View Users</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Stats Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card card-total">
                <div class="stat-number" th:text="${total}">0</div>
                <div class="stat-label">Total Complaints</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-pending">
                <div class="stat-number" th:text="${pending}">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-progress">
                <div class="stat-number" th:text="${inProgress}">0</div>
                <div class="stat-label">In Progress</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card card-resolved">
                <div class="stat-number" th:text="${resolved}">0</div>
                <div class="stat-label">Resolved</div>
            </div>
        </div>
    </div>

    <!-- Complaints Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3">
            <h5 class="mb-0">All Complaints</h5>
        </div>
        <form th:action="@{/admin/dashboard}" method="get"
              class="row g-2 align-items-end p-3 border-bottom">
            <div class="col-md-6">
                <label for="search" class="form-label">Search</label>
                <input type="text" id="search" name="search" class="form-control"
                       placeholder="Title, category, or citizen"
                       th:value="${search}">
            </div>
            <div class="col-md-3">
                <label for="statusFilter" class="form-label">Status</label>
                <select id="statusFilter" name="statusFilter" class="form-select">
                    <option value="" th:selected="${#strings.isEmpty(statusFilter)}">All</option>
                    <option value="PENDING" th:selected="${statusFilter == 'PENDING'}">Pending</option>
                    <option value="IN_PROGRESS" th:selected="${statusFilter == 'IN_PROGRESS'}">In Progress</option>
                    <option value="RESOLVED" th:selected="${statusFilter == 'RESOLVED'}">Resolved</option>
                    <option value="REJECTED" th:selected="${statusFilter == 'REJECTED'}">Rejected</option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Search</button>
                <a href="/admin/dashboard" class="btn btn-outline-secondary">Clear</a>
            </div>
        </form>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(complaints)}"
                 class="text-center py-5 text-muted">
                No complaints submitted yet.
            </div>
            <div class="table-responsive">
                <table th:if="${!#lists.isEmpty(complaints)}"
                       class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Citizen</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="complaint : ${complaints}"
                            class="complaint-row">
                            <td th:text="${complaint.id}"></td>
                            <td th:text="${complaint.title}"></td>
                            <td th:text="${complaint.category}"></td>
                            <td th:text="${complaint.citizen.name}"></td>
                            <td th:text="${complaint.location}"></td>
                            <td>
                                <span class="badge rounded-pill px-2 py-1"
                                      th:classappend="'badge-' + ${complaint.status.name()}"
                                      th:text="${complaint.status == T(com.grievance.grievance_tracker.model.ComplaintStatus).IN_PROGRESS} ? 'In Progress' : (${complaint.status == T(com.grievance.grievance_tracker.model.ComplaintStatus).PENDING} ? 'Pending' : (${complaint.status == T(com.grievance.grievance_tracker.model.ComplaintStatus).RESOLVED} ? 'Resolved' : 'Rejected'))">
                                </span>
                            </td>
                            <td th:text="${#temporals.format(complaint.createdAt,
                                          'dd MMM yyyy')}"></td>
                            <td>
                                <a th:href="@{/admin/complaint/{id}(id=${complaint.id})}"
                                   class="btn btn-primary btn-sm">Manage</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination Controls -->
        <div class="card-footer bg-white border-0 py-3"
             th:if="${totalPages > 1}">
            <nav>
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/dashboard(page=${currentPage - 1},search=${search},statusFilter=${statusFilter})}">
                            Previous
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/dashboard(page=${i},search=${search},statusFilter=${statusFilter})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/dashboard(page=${currentPage + 1},search=${search},statusFilter=${statusFilter})}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmW8tXSX1pFvIYM1IHk9RKH61TK" crossorigin="anonymous">
</script>
</body>
</html>

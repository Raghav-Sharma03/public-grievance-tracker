<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: #1a73e8 !important; }
        .error-card {
            max-width: 500px;
            margin: 80px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #1a73e8;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">Grievance Tracker</span>
    </div>
</nav>

<div class="container">
    <div class="card error-card">
        <div class="error-code" th:text="${errorCode} ?: '500'"></div>
        <h4 class="mt-2 mb-3">Oops, something went wrong</h4>
        <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred.'"></p>
        <a href="/citizen/dashboard" class="btn btn-primary mt-3">
            Go to Dashboard
        </a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <title>Login - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-header {
            background: #1a73e8;
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 24px;
            text-align: center;
        }
        .btn-login {
            background: #1a73e8;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-login:hover { background: #1557b0; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <div class="login-header">
            <h4 class="mb-0">Public Grievance Tracker</h4>
            <small>Sign in to your account</small>
        </div>
        <div class="card-body p-4">

            <div id="successMsg" class="alert alert-success"
                 style="display:none;">
                Registration successful! Please login.
            </div>
            <div id="errorMsg" class="alert alert-danger"
                 style="display:none;">
                Invalid email or password!
            </div>
            <div id="logoutMsg" class="alert alert-info"
                 style="display:none;">
                You have been logged out.
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>
                <button type="button" class="btn btn-login"
                        onclick="submitLogin()">Login</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                Don't have an account?
                <a href="/register">Register here</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Show messages based on URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered')) {
        document.getElementById('successMsg').style.display = 'block';
    }
    if (params.get('error')) {
        document.getElementById('errorMsg').style.display = 'block';
    }
    if (params.get('logout')) {
        document.getElementById('logoutMsg').style.display = 'block';
    }

    function submitLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('errorMsg').textContent = 'Please fill all fields.';
            return;
        }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/login';

        const emailInput = document.createElement('input');
        emailInput.name = 'email';
        emailInput.value = email;

        const passwordInput = document.createElement('input');
        passwordInput.name = 'password';
        passwordInput.value = password;

        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = document.querySelector('meta[name="_csrf_parameter"]').content;
        csrfInput.value = document.querySelector('meta[name="_csrf"]').content;

        form.appendChild(emailInput);
        form.appendChild(passwordInput);
        form.appendChild(csrfInput);
        document.body.appendChild(form);
        form.submit();
    }
</script>
</body>
</html>

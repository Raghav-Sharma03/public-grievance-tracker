<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <title>Register - Grievance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .register-card {
            max-width: 480px;
            margin: 60px auto;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .register-header {
            background: #1a73e8;
            color: white;
            border-radius: 12px 12px 0 0;
            padding: 24px;
            text-align: center;
        }
        .btn-register {
            background: #1a73e8;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-register:hover { background: #1557b0; }
    </style>
</head>
<body>
<div class="container">
    <div class="card register-card">
        <div class="register-header">
            <h4 class="mb-0">Create Account</h4>
            <small>Register as a Citizen</small>
        </div>
        <div class="card-body p-4">

            <div id="errorMsg" class="alert alert-danger"
                 style="display:none;"></div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter your full name">
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="Minimum 6 characters">
            </div>
            <button type="button" class="btn btn-register"
                    onclick="submitRegister()">Create Account</button>

            <hr>
            <p class="text-center mb-0">
                Already have an account?
                <a href="/login">Login here</a>
            </p>
        </div>
    </div>
</div>

<script>
    function submitRegister() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!name || !email || !password) {
            showError('Please fill all fields.');
            return;
        }
        if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            return;
        }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/register';

        const n = document.createElement('input');
        n.type = 'hidden';
        n.name = 'name';
        n.value = name;

        const e = document.createElement('input');
        e.type = 'hidden';
        e.name = 'email';
        e.value = email;

        const p = document.createElement('input');
        p.type = 'hidden';
        p.name = 'password';
        p.value = password;

        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = document.querySelector('meta[name="_csrf_parameter"]').content;
        csrfInput.value = document.querySelector('meta[name="_csrf"]').content;

        form.appendChild(n);
        form.appendChild(e);
        form.appendChild(p);
        form.appendChild(csrfInput);
        document.body.appendChild(form);

        console.log('Submitting POST to /register...');
        form.submit();
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.style.display = 'block';
        el.textContent = msg;
    }
</script>
</body>
</html>

spring.application.name=grievance-tracker

# Database configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/grievance_tracker?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=false
spring.flyway.baseline-version=3

# Thymeleaf configuration
spring.thymeleaf.cache=true

# Server configuration
server.port=${PORT:8080}

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/complaints/}

# Actuator configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

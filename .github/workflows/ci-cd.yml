name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean compile -q

      - name: Run tests
        run: ./mvnw test

      - name: Package application
        run: ./mvnw package -DskipTests -q

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check for dependency vulnerabilities
        run: ./mvnw dependency:analyze -q

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [ build-and-test, security-scan ]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Trigger Render Dev Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK }}"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build-and-test, security-scan ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Production Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
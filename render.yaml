services:
  - type: web
    name: public-grievance-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: false
    startCommand: java -Xmx256m -Xms128m -jar /app/grievance-tracker.jar
    # Production image storage should use a persistent disk with UPLOAD_DIR set to its mount path.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
